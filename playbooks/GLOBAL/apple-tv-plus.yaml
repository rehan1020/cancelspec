id: apple-tv-plus
name: Apple TV+
aliases:
  - Apple TV
  - Apple TV Plus
category: streaming-video
website: https://tv.apple.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://tv.apple.com
    steps:
      - Open tv.apple.com in your web browser.
      - Click Sign In at the top of the page.
      - Click the account icon at the top.
      - Click Settings.
      - Scroll down to Subscriptions. Click Manage.
      - Click Cancel Subscription. Confirm the choice.
  - channel: apple
    steps:
      - Open Settings on your device.
      - Tap your name at the top.
      - Tap Subscriptions in the list.
      - Tap Apple TV+.
      - Tap Cancel Subscription. Confirm the choice.
    notes: Sourced from Apple Support page. Refer to the Apple Subscriptions guide for details.
  - channel: google-play
    steps:
      - Open the Apple TV app or go to play.google.com.
      - Open your list of subscriptions.
      - Choose Apple TV+.
      - Tap Cancel Subscription. Confirm your choice.
    notes: Subscriptions billed through Google Play must be cancelled through Google Play.
  - channel: amazon
    steps:
      - Log in to Amazon. Open your subscriptions.
      - Find Apple TV+ in the list.
      - Click Manage Subscription. Choose cancel.
    notes: Subscriptions billed through Amazon must be cancelled directly through Amazon.
