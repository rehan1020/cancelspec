id: spotify
name: Spotify
aliases:
  - Spotify Premium
category: streaming-music
website: https://spotify.com
merchant_patterns:
  - SPOTIFY*
  - SPOTIFY USA*
channels:
  - channel: direct
    entry_url: https://www.spotify.com/account/
    steps:
      - Log into your Spotify account page in a web browser.
      - Select Manage your plan under Your plan.
      - Select Change plan and scroll to Cancel Spotify.
      - Click Cancel Premium. Confirm to finish.
    notes: Your account reverts to the free tier at the end of your billing cycle.
  - channel: apple
    steps:
      - Open Settings on your iPhone or iPad.
      - Tap your name at the top.
      - Tap Subscriptions. Open your active list.
      - Select Spotify. Tap to cancel.
tags:
