id: adobe-creative-cloud
name: Adobe Creative Cloud
category: software
website: https://www.adobe.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://account.adobe.com/plans
    steps:
      - Sign in to your Adobe account at account.adobe.com/plans.
      - Select Manage plan for the plan you want to cancel.
      - Select Cancel your plan under Available actions.
      - Check your plan details and select Continue to cancel.
      - Select your cancellation reason and select Continue.
      - Check your cancellation details and select Confirm cancellation.
    source: https://helpx.adobe.com/manage-account/using/cancel-subscription.html
  - channel: apple
    steps: []
    notes: Subscriptions purchased from an app store must be cancelled through that app store; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions purchased from Google Play must be cancelled through Google Play; see the Google Play guide.
