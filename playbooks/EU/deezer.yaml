id: deezer
name: Deezer
aliases:
  - Deezer Premium
category: streaming-music
website: https://deezer.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.deezer.com/account
    steps:
      - Go to Deezer and sign in.
      - Go to your profile.
      - Select Account Settings.
      - Select Manage my subscription.
      - Select Cancel my subscription.
      - Select the reason for canceling and then select Confirm.
    notes: If you cancel your Deezer Premium subscription, you keep access to Premium features until the end of your current subscription period. After that, your account will revert to Deezer Free.
    source: https://support.deezer.com/hc/en-gb/articles/214349245-Cancel-Your-Deezer-Subscription
  - channel: other
    notes: Steps for the Deezer mobile app.
    steps:
      - In the Deezer app, select your profile icon.
      - Select the Settings cog icon.
      - Select Manage my subscription.
      - Select Cancel my subscription.
      - Select the reason for canceling and then select Confirm.
    source: https://support.deezer.com/hc/en-gb/articles/214349245-Cancel-Your-Deezer-Subscription
  - channel: apple
    steps: []
    notes: If you subscribe to Deezer through your Apple account, you can only cancel directly with Apple.
  - channel: carrier-billing
    steps: []
    notes: If you pay as part of a mobile provider bundle or partnership, you must cancel through the respective partner directly.
