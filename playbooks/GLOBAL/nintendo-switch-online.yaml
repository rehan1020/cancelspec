channels:
  - channel: direct
    entry_url: https://accounts.nintendo.com
    steps:
      - Go to accounts.nintendo.com on the web.
      - Sign in with your Nintendo Account.
      - Click Nintendo Switch Online in the menu.
      - Find the Active Plan section.
      - Click Turn Off Auto-Renewal to stop your plan.
      - Click Confirm to complete the change.
    source: https://en-americas-support.nintendo.com/app/answers/detail/a_id/41196
  - channel: other
    notes: Steps for Nintendo Switch console.
    steps:
      - Open Nintendo eShop from the HOME Menu.
      - Select your account icon in the top right.
      - Highlight Nintendo Switch Online on the left side.
      - Select Turn Off Auto-Renewal on the screen.
      - Confirm your choice on the screen.
    source: https://en-americas-support.nintendo.com/app/answers/detail/a_id/41196
