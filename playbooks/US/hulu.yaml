merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://secure.hulu.com/account
    steps:
      - Go to your Account page in a computer or mobile browser.
      - Select Cancel under Your Subscription.
      - If Hulu offers a pause, select Continue to Cancel.
      - Select Cancel Subscription.
    notes: You keep access until the end of your billing cycle.
    source: https://help.hulu.com/article/hulu-cancel-hulu-subscription
  - channel: apple
    steps: []
    notes: If billed through Apple, cancel through Apple; confirm your billing party on your Hulu Account page under Payment Information.
  - channel: google-play
    steps: []
    notes: If billed through Google, cancel through Google; confirm your billing party on your Hulu Account page under Payment Information.
  - channel: amazon
    steps: []
    notes: If billed through Amazon, cancel through Amazon; confirm your billing party on your Hulu Account page under Payment Information.
