    entry_url: https://www.walmart.com/account
    steps:
      - Go to your walmart.com account.
      - Select Walmart+.
      - Select Manage membership.
      - Select Manage beside Walmart+ plan.
      - Select Cancel beside Cancel membership.
      - Select Confirm cancellation to finish.
