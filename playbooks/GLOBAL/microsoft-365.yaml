id: microsoft-365
name: Microsoft 365
category: software
website: https://www.microsoft.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://account.microsoft.com/services
    steps:
      - Go to account.microsoft.com/services in your web browser.
      - Sign in with the account used to purchase your subscription.
      - Select Manage next to Microsoft 365.
      - Select Cancel subscription (if it is not shown, select Turn off recurring billing).
      - Follow the prompts to complete cancellation.
    notes: Access continues until the expiration date. If purchased from Google Play or Apple App Store, manage through their store.
    source: https://support.microsoft.com/en-us/account-billing/cancel-a-microsoft-365-subscription-46e2634c-c64b-4c65-94b9-2cc9c960e91b
  - channel: apple
    steps: []
    notes: Subscriptions billed through Apple are cancelled through Apple; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions billed through Google Play are cancelled through Google Play; see the Google Play guide.
