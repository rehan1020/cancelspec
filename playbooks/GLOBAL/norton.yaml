id: norton
name: Norton
category: vpn-security
website: https://norton.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://my.norton.com
    steps:
      - Sign in to your account at my.norton.com.
      - Click the My Subscriptions tab.
      - Find the plan you want to stop.
      - Click Cancel Subscription Renewal next to it.
      - Click Unsubscribe next to Plan Renewal.
      - Choose a reason for leaving and click Next.
      - Click No thanks, cancel my subscription, then click Next.
    notes: Allow up to 24 hours for this change to appear in your account. Your subscription will continue through the end of your already paid subscription term.
    source: https://support.norton.com/sp/en/us/home/current/solutions/kb20090818144126EN
