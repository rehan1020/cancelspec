id: google-play
name: Google Play Subscriptions
kind: channel-guide
outcome: cancel
category: software
website: https://play.google.com
merchant_patterns:
  - GOOGLE*PLAY*
  - GOOGLE *PLAY*
channels:
  - channel: google-play
    entry_url: https://play.google.com/store/account/subscriptions
    steps:
      - Go to your Google Play subscriptions page.
      - Click Manage next to the subscription.
      - Click Cancel subscription to open the prompt.
      - Pick a reason for canceling.
      - Click Continue. Confirm to finish.
    notes: Uninstalling an app does not cancel your subscription.
