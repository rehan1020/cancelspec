channels:
  - channel: direct
    entry_url: https://one.google.com
    steps:
      - Go to Google One on your web browser.
      - Click Settings, then Cancel membership.
      - To confirm, click Cancel membership.
    notes: Storage and benefits remain available until the end of your billing cycle.
    source: https://support.google.com/googleone/answer/9056360?hl=en
  - channel: google-play
    steps:
      - On your Android phone or tablet, open the Google One app.
      - At the top, tap Menu, then Settings, then Cancel membership.
      - To confirm, tap Cancel membership.
    notes: Storage and benefits remain available until the end of your billing cycle.
    source: https://support.google.com/googleone/answer/9056360?hl=en
  - channel: apple
    steps: []
    notes: Subscriptions billed through Apple are cancelled through Apple; see the Apple Subscriptions guide.
