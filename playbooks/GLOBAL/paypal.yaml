id: paypal
name: PayPal Automatic Payments
kind: channel-guide
outcome: cancel
category: software
website: https://paypal.com
merchant_patterns: []
channels:
  - channel: paypal
    entry_url: https://www.paypal.com/myaccount/autopay/
    steps:
      - Log in to your PayPal account.
      - Go to Settings.
      - Click Payments.
      - Select Subscriptions and saved businesses or Automatic Payments.
      - Select the merchant.
      - Cancel the automatic payment.
    notes: Cancelling an automatic payment stops future billings from that merchant.
    source: https://www.paypal.com/us/cshelp/article/what-is-an-automatic-payment-and-how-do-i-update-or-cancel-one-help240
