id: new-york-times
name: The New York Times
aliases:
  - NYTimes
  - NYT Digital
category: news-media
website: https://nytimes.com
outcome: cancel
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.nytimes.com/subscription/cancel
    steps:
      - Log into your account and select Subscription Overview.
      - Select Cancel your Subscription in the Manage Subscription section.
      - Follow the instructions to cancel.
    notes: Eligible digital and Home Delivery subscriptions can be cancelled online. Once cancelled, you will have limited access to content.
    source: https://help.nytimes.com/360003499613-Cancel-Your-Subscription
  - channel: other
    notes: Chat route.
    steps:
      - Select Contact Customer Care at the bottom of the page to chat with a Customer Care Advocate.
      - Request cancellation during support hours (7 a.m. to 5 p.m. ET Monday-Friday, 7 a.m. to 2 p.m. ET weekends/holidays).
    source: https://help.nytimes.com/360003499613-Cancel-Your-Subscription
  - channel: other
    notes: Phone route.
    steps:
      - Call 866-273-3612 if in the U.S. (international contact info available online).
      - Request cancellation during support hours (7 a.m. to 5 p.m. ET Monday-Friday, 7 a.m. to 2 p.m. ET weekends/holidays).
    source: https://help.nytimes.com/360003499613-Cancel-Your-Subscription
  - channel: apple
    steps: []
    notes: Subscriptions purchased through Apple App Store must be cancelled directly through Apple.
  - channel: google-play
    steps: []
    notes: Subscriptions purchased through Google Play must be cancelled directly through Google Play.
