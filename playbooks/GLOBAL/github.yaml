channels:
  - channel: direct
    entry_url: https://github.com/settings/billing
    steps:
      - Navigate to your GitHub Settings in a web browser.
      - Select Billing and plans from the left sidebar.
      - Select Plans and usage.
      - Select Edit next to your plan and choose Downgrade to Free.
      - Follow the prompts to confirm your downgrade.
    notes: Access remains active until the end of your billing cycle.
