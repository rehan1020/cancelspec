category: gaming
website: https://playstation.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.playstation.com
    steps:
      - Go to playstation.com in your web browser.
      - Sign in to your account.
      - Click your icon. Go to Account Management.
      - Select Subscription from the left menu.
      - Find PlayStation Plus and click Cancel.
      - Confirm your choice to end the plan.
  - channel: other
    notes: Steps for PlayStation consoles.
    steps:
      - Turn on your PS5 console.
      - Open Settings from the home screen.
      - Select Users and Accounts.
      - Choose Account, then Payment and Subscriptions.
      - Select Subscriptions, then choose your plan.
      - Select Cancel Subscription to finish the task.
