channels:
  - channel: direct
    entry_url: https://accounts.nintendo.com/portal
    steps:
      - Visit accounts.nintendo.com/portal and sign in to your Nintendo Account.
      - Select Nintendo Switch Online.
      - Select Cancel Your Subscription by Turning Off Automatic Renewal.
      - Select Confirm to turn off automatic renewal.
    notes: Turn off auto-renewal at least 48 hours before renewal. Once turned off, auto-renewal cannot be turned back on.
    source: https://en-americas-support.nintendo.com/app/answers/detail/a_id/41196
  - channel: other
    notes: Steps for Nintendo Switch console. Turn off auto-renewal at least 48 hours before renewal. Once turned off, it cannot be turned on again.
    steps:
      - Select Nintendo eShop on the HOME Menu.
      - Select the account that purchased the Nintendo Switch Online membership.
      - Select the picture of your icon in the upper-right corner for Account Information.
      - Highlight Nintendo Switch Online on the left side of the screen.
      - Select Cancel Your Subscription by Turning Off Automatic Renewal.
    source: https://en-americas-support.nintendo.com/app/answers/detail/a_id/41196
