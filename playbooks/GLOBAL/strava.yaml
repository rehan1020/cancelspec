    steps: []
    notes: Subscriptions started in the iOS app are managed through the Apple App Store; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions started via Google Play are managed through Google Play; see the Google Play guide.
