channels:
  - channel: direct
    entry_url: https://www.spotify.com/account/
    steps:
      - Log in to your account page in a web browser.
      - Go to Manage your plan.
      - Select Cancel subscription.
    notes: Premium continues until the next billing date, then your account switches to free. If you cancel during a zero-priced free trial, your account switches to free immediately. If no option to change plan appears, your subscription is billed through a partner company.
    source: https://support.spotify.com/article/cancel-premium/
