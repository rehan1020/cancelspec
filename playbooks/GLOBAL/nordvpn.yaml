id: nordvpn
name: NordVPN
category: vpn-security
website: https://nordvpn.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://my.nordaccount.com
    steps:
      - Log in to my.nordaccount.com in your web browser.
      - Click Billing on the left menu.
      - Find the Subscriptions section.
      - Click Cancel next to auto-renew.
      - Click Cancel. Turn off auto-renewal for your plan.
      - Check that auto-renewal now says off.
  - channel: apple
    notes: Subscriptions purchased through Apple App Store must be cancelled through Apple.
    steps:
      - Open the Settings app on your device.
      - Tap your name at the top.
      - Tap Subscriptions in the list.
      - Choose NordVPN.
      - Tap Cancel Subscription and confirm.
  - channel: google-play
    notes: Subscriptions purchased through Google Play Store must be cancelled through Google Play.
    steps:
      - Open the Google Play Store on your device.
      - Tap your profile icon at top right.
      - Tap Payments and subscriptions.
      - Tap Subscriptions in the list.
      - Choose NordVPN.
      - Tap Cancel subscription and confirm.
