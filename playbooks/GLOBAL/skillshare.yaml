channels:
  - channel: direct
    entry_url: https://www.skillshare.com
    steps:
      - Go to Account settings on skillshare.com.
      - Select Membership & Payments from the left menu.
      - Click Cancel membership.
      - Follow the prompts to confirm your cancellation.
    notes: On a mobile browser, open skillshare.com, tap your profile icon, select Account settings, tap Membership & Payments, and tap Cancel membership.
    source: https://help.skillshare.com/hc/en-us/articles/115001701651-How-do-I-cancel-my-Skillshare-subscription
