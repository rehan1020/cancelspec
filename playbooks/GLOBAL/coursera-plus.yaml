channels:
  - channel: direct
    entry_url: https://coursera.org
    steps:
      - Log in to Coursera.org in a computer or mobile web browser.
      - Go to your Purchases page.
      - Find the subscription you want to cancel under the Subscriptions tab.
      - Click Cancel subscription.
    notes: For subscriptions started on the web, you can also cancel in the Coursera mobile app via Settings (gear icon) > My Subscriptions > Manage Subscription > Cancel subscription.
    source: https://www.coursera.support/s/article/learner-000001189?language=en_US
  - channel: apple
    steps: []
    notes: Subscriptions started in the iOS app are billed through Apple; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions started in the Android app are billed through Google Play; see the Google Play guide.
