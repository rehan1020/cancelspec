id: expressvpn
name: ExpressVPN
category: vpn-security
website: https://expressvpn.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.expressvpn.com
    steps:
      - Go to expressvpn.com in your web browser.
      - Log in to your ExpressVPN account.
      - Navigate to the My subscription page.
      - Click Cancel subscription to stop the plan.
      - Follow the on-screen prompts to confirm.
  - channel: apple
    notes: Purchases through the Apple App Store must be cancelled through Apple.
    steps:
      - Open the App Store on your Apple device.
      - Tap your profile icon at top right.
      - Tap Subscriptions in the list.
      - Choose ExpressVPN.
      - Tap Cancel Subscription and confirm.
  - channel: google-play
    notes: Purchases through the Google Play Store must be cancelled through Google Play.
    steps:
      - Open the Google Play Store app.
      - Tap your profile icon at top right.
      - Tap Payment and subscriptions.
      - Tap Subscriptions in the list.
      - Choose ExpressVPN.
      - Tap Cancel Subscription and confirm.
