name: main-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check configuration placeholders
        run: |
          if grep -q "REPLACE_ME" project.config; then
            echo "ERROR: project.config contains placeholder values (REPLACE_ME)."
            echo "Deployment to GitHub Pages is refused until maintainer sets production repository URLs and contact addresses."
            exit 1
          fi

      - name: Build monorepo and site
        run: |
          npm run build
          npm run build:site

      # TODO(#5): Reproducible-build check
      - name: Verify reproducible build
        run: |
          node packages/cli/dist/cli.js build --site --outDir ./site-check1
          node packages/cli/dist/cli.js build --site --outDir ./site-check2
          if diff -r ./site-check1 ./site-check2 > /dev/null; then
            echo "✓ Reproducible build gate passed: bit-identical outputs across builds."
            rm -rf ./site-check1 ./site-check2
          else
            echo "ERROR: Reproducible build gate failed: outputs differed across repeated builds."
            diff -r ./site-check1 ./site-check2
            exit 1
          fi

      # TODO(#6): Deploy to GitHub Pages using pinned official actions
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # TODO(#7): Post-deploy smoke test
      - name: Post-deploy smoke test
        run: |
          DEPLOY_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Testing deployment at $DEPLOY_URL..."
          # 1. Fetch home page
          curl -fsSL "$DEPLOY_URL" > /dev/null || curl -fsSL "${DEPLOY_URL}index.html" > /dev/null
          # 2. Fetch data bundle
          curl -fsSL "${DEPLOY_URL}data/bundle.latest.json" > /dev/null
          # 3. Fetch one service page if any exist
          if [ -d "./site/services" ] && find ./site/services -name "index.html" | grep -qv "services/index.html"; then
            SERVICE_PATH=$(find ./site/services -name "index.html" | grep -v "services/index.html" | head -n 1 | sed 's|^\./site/||')
            curl -fsSL "${DEPLOY_URL}${SERVICE_PATH}" > /dev/null
          fi
          echo "✓ Post-deploy smoke test passed."
