id: strava
name: Strava
aliases:
  - Strava Subscription
  - Strava Premium
category: fitness-health
website: https://www.strava.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.strava.com/settings/account
    steps:
      - Log in to your Strava account at strava.com.
      - Select your profile picture in the top right corner.
      - Go to Settings, then My Account.
      - Select Cancel subscription.
    notes: You retain access until the end of your term. Canceling does not delete uploaded activities or data.
    source: https://support.strava.com/en-us/articles/15401936-how-do-i-cancel-my-subscription
  - channel: apple
    steps:
      - Open the Strava app and go to the You tab.
      - Tap the gear icon to open Settings.
      - Select Your Strava Subscription, then Manage Your Subscription.
      - Complete cancellation in the App Store.
    notes: Subscriptions started in the iOS app are managed through the Apple App Store.
    source: https://support.strava.com/en-us/articles/15401936-how-do-i-cancel-my-subscription
  - channel: google-play
    steps:
      - Open the Strava app and go to the You tab.
      - Tap the gear icon to open Settings.
      - Select Your Strava Subscription, then Manage Your Subscription.
      - Complete cancellation in Google Play.
    notes: Subscriptions started in the Android app are managed through Google Play.
    source: https://support.strava.com/en-us/articles/15401936-how-do-i-cancel-my-subscription
