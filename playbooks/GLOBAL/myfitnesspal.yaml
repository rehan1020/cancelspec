id: myfitnesspal
name: MyFitnessPal
category: fitness-health
website: https://www.myfitnesspal.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.myfitnesspal.com
    steps:
      - Log in to the website at myfitnesspal.com.
      - Click Settings, then click Subscription Settings.
      - Set the Auto-Renewal toggle at the bottom from On to Off.
    notes: Premium features will remain available until the end of your current paid subscription period. Cancel at least 24 hours before your next renewal date to avoid a renewal charge.
    source: https://support.myfitnesspal.com/hc/en-us/articles/360032625371-How-to-cancel-your-Premium-subscription-renewal
  - channel: apple
    steps:
      - Open the Settings App on your phone.
      - Tap on your name at the top.
      - Tap Subscriptions.
      - Select MyFitnessPal.
      - Tap Cancel Subscription.
    source: https://support.myfitnesspal.com/hc/en-us/articles/360032625371-How-to-cancel-your-Premium-subscription-renewal
  - channel: google-play
    steps:
      - Open your Play Store App.
      - Tap your Profile Icon in the upper right to open the menu.
      - Tap Payments and subscriptions, then tap Subscriptions.
      - Select your MyFitnessPal Subscription.
      - Tap Cancel Subscription at the bottom.
    source: https://support.myfitnesspal.com/hc/en-us/articles/360032625371-How-to-cancel-your-Premium-subscription-renewal
