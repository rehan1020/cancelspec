id: youtube-premium
name: YouTube Premium
aliases:
  - YouTube Music Premium
category: streaming-video
website: https://youtube.com
merchant_patterns:
  - GOOGLE*YOUTUBE PREMIUM*
  - YOUTUBE PREMIUM*
channels:
  - channel: direct
    entry_url: https://www.youtube.com/paid_memberships
    steps:
      - Go to your paid memberships page.
      - Click Manage membership to view your plan details.
      - Click Deactivate to begin.
      - Click Continue to cancel.
      - Choose your reason and click next.
      - Click Yes, cancel to finish.
    notes: Your benefits will continue until the end of your billing cycle.
  - channel: apple
    steps:
      - Open Settings on your iPhone or iPad.
      - Tap your name at the top.
      - Tap Subscriptions. Open your active list.
      - Select YouTube. Tap to cancel.
  - channel: google-play
    steps:
      - Open your Google Play settings.
      - Find YouTube Premium and tap Cancel.
