id: paypal
name: PayPal Automatic Payments
kind: channel-guide
outcome: cancel
category: software
website: https://paypal.com
merchant_patterns:
  - PAYPAL*
channels:
  - channel: paypal
    entry_url: https://www.paypal.com/myaccount/autopay/
    steps:
      - Go to the PayPal site and sign in.
      - Click Settings at the top of the page.
      - Click Payments.
      - Click Manage automatic payments. Look for this on your page.
      - Choose the seller you want to stop.
      - Click Cancel. Confirm your choice to finish.
    notes: Cancelling an automatic payment stops future billings from that merchant.
