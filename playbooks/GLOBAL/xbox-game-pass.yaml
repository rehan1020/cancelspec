id: xbox-game-pass
name: Xbox Game Pass
aliases:
  - Game Pass
  - PC Game Pass
  - Xbox Game Pass Ultimate
category: gaming
website: https://www.xbox.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://account.microsoft.com/services
    steps:
      - Go to Subscriptions on account.microsoft.com/services and sign in with the Microsoft account used to purchase the subscription.
      - Find your subscription and select Manage.
      - Select Cancel subscription and follow the on-screen instructions.
    notes: Turning off recurring billing stops future charges and preserves benefits until the expiration date. Eligible accounts may receive an option to cancel immediately with a refund.
    source: https://support.xbox.com/en-US/help/subscriptions-billing/manage-subscriptions/cancel-recurring-billing-or-subscription
  - channel: other
    steps:
      - Press the Xbox button on the controller to open the guide.
      - Go to Profile & system > Settings > Account > Subscriptions.
      - Choose the subscription to manage, select Cancel subscription, and follow the steps.
    notes: Xbox console cancellation. If eligible, you may be prompted to initiate a refund.
    source: https://support.xbox.com/en-US/help/subscriptions-billing/manage-subscriptions/cancel-recurring-billing-or-subscription
