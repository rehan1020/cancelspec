id: google-play
name: Google Play Subscriptions
kind: channel-guide
outcome: cancel
category: software
website: https://play.google.com
merchant_patterns: []
channels:
  - channel: google-play
    entry_url: https://play.google.com/store/account/subscriptions
    steps:
      - Go to your Google Play subscriptions page.
      - Click Manage next to the subscription.
      - Click Cancel subscription to open the prompt.
      - Pick a reason for canceling.
      - Click Continue.
    notes: Uninstalling an app does not cancel your subscription.
    source: https://support.google.com/googleplay/answer/7018481?hl=en
  - channel: google-play
    notes: Steps for an Android device.
    steps:
      - On your Android device, go to subscriptions in Google Play.
      - Select the subscription you want to cancel.
      - Tap Cancel subscription.
      - Follow the instructions.
    source: https://support.google.com/googleplay/answer/7018481?hl=en
