channels:
  - channel: direct
    entry_url: https://music.apple.com
    steps:
      - Go to music.apple.com in a web browser.
      - Click Sign In at the top of the page.
      - Click the My Account icon.
      - Click Settings.
      - Scroll down to Subscriptions. Click Manage.
      - Click Cancel Subscription. Confirm the choice.
    source: https://support.apple.com/en-us/118399
