channels:
  - channel: direct
    entry_url: https://www.dropbox.com
    steps:
      - Log in to your account on dropbox.com.
      - Click your profile icon at the bottom left.
      - Choose Manage account from the menu.
      - Click Cancel plan at the bottom of the page.
      - Choose a reason for canceling your plan.
      - Click Continue canceling and follow the prompts.
      - Check your inbox. Look for the email notice.
