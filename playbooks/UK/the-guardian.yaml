id: the-guardian
name: The Guardian
category: news-media
website: https://www.theguardian.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://manage.theguardian.com
    steps:
      - Log in to Manage My Account at manage.theguardian.com.
      - Select Manage subscription/contribution/membership under your account overview.
      - Scroll to the bottom of the page and follow the cancellation instructions.
    notes: Print and Guardian Weekly subscriptions in the UK cannot be cancelled online and require contacting customer service (+44 (0) 330 333 6767).
    source: https://help.theguardian.com/article/how-do-i-cancel-my-subscription-or-recurring-contribution
  - channel: apple
    steps:
      - Go to Settings on your Apple device.
      - Tap your name, then tap Subscriptions.
      - Select the Guardian to disable auto-renewal.
    source: https://help.theguardian.com/article/how-do-i-cancel-my-subscription-or-recurring-contribution
  - channel: google-play
    steps:
      - Open the Google Play Store.
      - Search for the Guardian or open Subscriptions.
      - Select Cancel.
    source: https://help.theguardian.com/article/how-do-i-cancel-my-subscription-or-recurring-contribution
