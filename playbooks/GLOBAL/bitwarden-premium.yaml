id: bitwarden-premium
name: Bitwarden Premium
category: software
website: https://bitwarden.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://vault.bitwarden.com
    steps:
      - In the web app, go to Settings → Subscription.
      - Take note of the Next charge date when paid features will end.
      - Select Cancel Subscription.
    notes: Paid features end at the end of the current billing cycle (account reverts to free individual plan). You can select Reinstate subscription on the same page to turn renewal back on before the cycle ends. Cancelling renewal does not delete your vault data.
    source: https://bitwarden.com/help/cancel-a-subscription/
refund_window:
  value: 30 days
  source: https://bitwarden.com/help/cancel-a-subscription/
