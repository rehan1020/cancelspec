id: deezer
name: Deezer
aliases:
  - Deezer Premium
category: streaming-music
website: https://deezer.com
merchant_patterns:
  - DEEZER*
channels:
  - channel: direct
    entry_url: https://www.deezer.com/account
    steps:
      - Log into your Deezer account on a web browser.
      - Click your profile image. Choose Settings.
      - Click Manage plan.
      - Click Cancel subscription. Confirm choice.
    notes: Your account reverts to the free Deezer tier at cycle end.
  - channel: apple
    steps:
      - Open Settings on your phone or tablet.
      - Tap your Apple ID banner.
      - Tap Subscriptions. Open your active list.
      - Select Deezer. Tap Cancel to end plan.
refund_window:
  value: 14 days statutory cooling-off in EU
  source: https://support.deezer.com/hc/en-gb/articles/115003869205-Cancel-Your-Deezer-Subscription
  accessed_on: 2026-10-31
auto_renews:
  value: true
