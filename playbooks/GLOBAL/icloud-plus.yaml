id: icloud-plus
name: iCloud+
aliases:
  - iCloud
  - iCloud Plus
category: cloud-storage
website: https://apple.com
merchant_patterns: []
outcome: downgrade
channels:
  - channel: apple
    steps:
      - Open the Settings app on your device, then tap your name.
      - Tap Subscriptions.
      - Choose iCloud+.
      - Tap Cancel Subscription.
    notes: For devices running iOS 18.4 and later.
    source: https://support.apple.com/en-us/108318
  - channel: apple
    notes: For devices running iOS 18.3 and earlier.
    steps:
      - Open the Settings app, then tap your name.
      - Tap iCloud, then tap Manage Plan or Manage Account Storage.
      - Tap Downgrade Options. If prompted, enter your Apple Account password.
      - Select a free or new plan, then tap Done.
    source: https://support.apple.com/en-us/108318
  - channel: direct
    notes: For Windows PC users with iCloud for Windows installed.
    steps:
      - Open the iCloud for Windows app on your PC.
      - Click Manage next to storage.
      - Click Change Storage Plan.
      - Click Downgrade Options in the window.
      - Enter your Apple password. Click Manage.
      - Choose the free 5GB plan to cancel paid storage.
      - Click Done to finish the downgrade.
    source: https://support.apple.com/en-us/108318
    entry_url: https://www.icloud.com
