id: bbc-select
name: BBC Select
aliases:
  - BBC Select US
category: streaming-video
website: https://bbcselect.com
merchant_patterns:
  - BBC SELECT*
channels:
  - channel: amazon
    entry_url: https://www.primevideo.com/help?nodeId=G3BQ95AL4WZLV9ZG
    steps:
      - Open Account & Settings on the Prime Video website.
      - Select Subscriptions from the top menu.
      - Find BBC Select on the list.
      - Click Unsubscribe. Confirm to finish.
    notes: Access continues until the current billing cycle ends.
    source: https://www.primevideo.com/help?nodeId=G3BQ95AL4WZLV9ZG
  - channel: apple
    entry_url: https://support.apple.com/en-us/118428
    steps:
      - Open Settings on your iPhone or iPad.
      - Tap your name at the top of the screen.
      - Tap Subscriptions. Open your active list.
      - Select BBC Select from your list.
      - Tap Cancel Subscription. Confirm to finish.
    notes: If billed through Apple, cancel at least 24 hours before renewal.
    source: https://support.apple.com/en-us/118428
  - channel: roku
    entry_url: https://support.roku.com/article/manage-or-cancel-subscriptions
    steps:
      - Open the Roku website and sign in.
      - Find BBC Select on the page.
      - Select Manage subscription to see your plan.
      - Click Turn off auto-renew. Confirm to finish.
    notes: You can also manage the subscription directly on your Roku device.
    source: https://support.roku.com/article/manage-or-cancel-subscriptions
