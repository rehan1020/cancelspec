    entry_url: https://www.siriusxm.com
    steps:
      - Log in to the SiriusXM Online Account Center.
      - Go to the Subscriptions tab.
      - Select your subscription and proceed with the cancellation prompts.
    notes: Direct-billed accounts can also cancel by chatting with an online agent or calling 866-635-8641. Cancel at least 24 hours before renewal.
