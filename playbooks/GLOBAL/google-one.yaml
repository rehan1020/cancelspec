id: google-one
name: Google One
aliases:
  - Google Drive Storage
  - Google Storage
category: cloud-storage
website: https://one.google.com
merchant_patterns:
  - GOOGLE*GOOGLE ONE*
  - GOOGLE*STORAGE*
channels:
  - channel: direct
    entry_url: https://one.google.com
    steps:
      - Go to Google One on your web browser.
      - Click Settings in the menu.
      - Click Cancel membership to view options.
      - Click Cancel membership. Confirm to finish.
    notes: Your storage stays active until your billing period ends.
  - channel: apple
    steps:
      - Open the App Store on your Apple device.
      - Tap your name at the top.
      - Tap Subscriptions and select Google One.
      - Tap Cancel Subscription. Confirm to finish.
refund_window:
  value: Non-refundable in most regions
