id: puregym
name: PureGym
category: fitness-health
website: https://puregym.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.puregym.com/members/
    steps:
      - Open the menu in the top left and select Sign in to log in to your Member's Area at puregym.com.
      - Select Manage on the Your gym pass tile.
      - Select Manage under the Freeze or cancel your membership tile.
      - Select Cancel my contract free membership under the Cancel your membership tile.
      - Follow the on-screen steps to complete the cancellation process.
    notes: Cancel at least 4 working days before your next payment date. Membership ends the day before your next payment day.
    source: https://www.puregym.com/help-centre/freezing-or-ending/how-do-i-cancel-my-monthly-membership/
