id: canva
name: Canva
category: software
website: https://www.canva.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://www.canva.com
    steps:
      - On the Canva homepage, select your account profile to open the menu.
      - Select Settings.
      - Go to Billing.
      - Under your plan, select Cancel plan.
      - Select Continue cancellation.
      - Choose your cancellation reason and select Continue cancellation.
      - Select Cancel subscription.
    source: https://www.canva.com/help/cancel-canva-plan/
  - channel: apple
    steps: []
    notes: Subscriptions purchased through Apple must be cancelled in your Apple ID account; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions purchased through Google Play must be cancelled in your Google Play account; see the Google Play guide.
