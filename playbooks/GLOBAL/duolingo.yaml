    entry_url: https://www.duolingo.com
    steps:
      - Sign in to your Duolingo account via a web browser.
      - Click your profile picture at the top of the home screen and choose Settings.
      - Select Super Duolingo.
      - Select Cancel subscription and confirm.
    notes: Deleting the app or account does not cancel your subscription. Learning progress is retained.
