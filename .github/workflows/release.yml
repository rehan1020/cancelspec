name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Run automated test & gate suite
        run: npm test

      - name: Execute release check & bundle generation
        run: |
          node packages/cli/dist/cli.js build
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Launch tag release: running release-check with strict drafts enabled"
            node packages/cli/dist/cli.js release-check --strict-drafts
          else
            echo "Normal build: running release-check without strict drafts"
            node packages/cli/dist/cli.js release-check
          fi

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          npm sbom --sbom-format=cyclonedx > dist/sbom.json

      - name: Generate SHA-256 Checksums
        run: |
          cd dist/data
          sha256sum bundle.*.json > SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release create "$TAG_NAME" \
            dist/data/bundle.*.json \
            dist/data/SHA256SUMS.txt \
            dist/sbom.json \
            --title "CancelSpec Release $TAG_NAME" \
            --notes "CancelSpec community dataset and cancellation tool release $TAG_NAME."
