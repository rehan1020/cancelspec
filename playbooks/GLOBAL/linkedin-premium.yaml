id: linkedin-premium
name: LinkedIn Premium
category: software
website: https://linkedin.com
merchant_patterns: []
outcome: downgrade
channels:
  - channel: direct
    entry_url: https://www.linkedin.com
    steps:
      - Log in to linkedin.com in your web browser.
      - Click the Me icon at the top of the homepage.
      - Click Premium features from the menu.
      - Click Manage subscription on the page.
      - Click Purchases on the left rail.
      - Choose your active plan from the list.
      - Click Cancel subscription under Actions.
    notes: A human must read the page in a browser before activation.
    source: https://www.linkedin.com/help/linkedin/answer/a545578/
  - channel: apple
    notes: Subscriptions billed through Apple are cancelled through Apple; see the Apple Subscriptions guide.
    steps: []
  - channel: google-play
    notes: Subscriptions billed through Google Play are cancelled through Google Play; see the Google Play Subscriptions guide.
    steps: []
