    notes: Subscriptions started through the iOS App Store are managed in Apple ID subscription settings; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions started through Google Play are managed in Google Play account settings; see the Google Play guide.
