id: apple-music
name: Apple Music
category: streaming-music
website: https://music.apple.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://music.apple.com
    steps:
      - Go to music.apple.com in a web browser.
      - Click Sign In at the top of the page.
      - Click the My Account icon.
      - Click Settings.
      - Scroll down to Subscriptions. Click Manage.
      - Click Cancel Subscription. Confirm the choice.
  - channel: apple
    steps:
      - Open Settings on your device.
      - Tap your name at the top.
      - Tap Subscriptions in the list.
      - Choose Apple Music.
      - Tap Cancel Subscription. Confirm the choice.
    notes: Sourced from Apple Support page. Refer to the Apple Subscriptions guide for details.
  - channel: google-play
    steps:
      - Open the Apple Music app or visit play.google.com.
      - Open your list of subscriptions.
      - Choose Apple Music.
      - Tap Cancel Subscription. Confirm the choice.
    notes: Subscriptions billed through Google Play must be cancelled through Google Play.
