      - Sign in to your account on 1Password.com.
      - Select Billing in the sidebar.
      - Click Cancel subscription and follow on-screen prompts.
    notes: Your subscription remains active until the end of the current billing
      cycle, then the account freezes.
    source: https://support.1password.com/manage-subscription/
