id: youtube-premium
name: YouTube Premium
aliases:
  - YouTube Music Premium
category: streaming-video
website: https://youtube.com
merchant_patterns:
  - GOOGLE*YOUTUBE PREMIUM*
pattern_source: https://support.google.com/youtube/answer/9346937?hl=en
channels:
  - channel: direct
    entry_url: https://www.youtube.com/paid_memberships
    steps:
      - Go to your paid memberships page.
      - Click Manage membership to view your plan details.
      - Click Deactivate to begin.
      - Click Continue to cancel.
      - Choose your reason and click next.
      - Click Yes, cancel to finish.
    notes: Your benefits will continue until the end of your billing cycle.
    source: https://support.google.com/youtube/answer/6308278?hl=en
  - channel: apple
    steps: []
    notes: Subscriptions billed through Apple are cancelled through Apple; see the Apple Subscriptions guide.
  - channel: google-play
    steps: []
    notes: Subscriptions billed through Google Play are cancelled through Google Play; see the Google Play Subscriptions guide.
