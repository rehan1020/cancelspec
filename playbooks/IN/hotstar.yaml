    entry_url: https://www.hotstar.com/in/my-account
    steps:
      - Go to My Space.
      - Click Help & Settings.
      - Click Account Settings.
      - Click Subscription and Devices.
      - Click Cancel.
      - Confirm cancel on the prompt.
    notes: Sourced from official JioHotstar Indian help article.
  - channel: google-play
    steps:
      - Open the Google Play Store app.
      - Tap your profile icon.
      - Tap Payments & subscriptions.
      - Tap Subscriptions.
      - Select JioHotstar.
      - Tap Cancel subscription.
      - Confirm to finish.
    notes: Sourced from official Google Play help page (https://support.google.com/googleplay/answer/7018481?hl=en).
