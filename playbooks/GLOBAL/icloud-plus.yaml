id: icloud-plus
name: iCloud+
aliases:
  - iCloud
  - iCloud Plus
category: cloud-storage
website: https://apple.com
merchant_patterns: []
outcome: downgrade
channels:
  - channel: apple
    steps:
      - Open the Settings app on your device.
      - Tap your name at the top.
      - Tap Subscriptions in the list.
      - Choose iCloud+ from the active list.
      - Tap Cancel Subscription to end the plan.
      - Confirm your choice on the screen.
  - channel: direct
    notes: For Windows PC users with iCloud for Windows installed.
    steps:
      - Open the iCloud for Windows app on your PC.
      - Click Manage next to storage.
      - Click Change Storage Plan.
      - Click Downgrade Options in the window.
      - Enter your Apple password. Click Manage.
      - Choose the free 5GB plan to cancel paid storage.
      - Click Done to finish the downgrade.
