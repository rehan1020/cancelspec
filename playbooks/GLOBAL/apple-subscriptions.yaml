id: apple-subscriptions
name: Apple Subscriptions
kind: channel-guide
outcome: cancel
category: software
website: https://apple.com
merchant_patterns:
  - APPLE.COM*
  - APPLE BILL*
channels:
  - channel: apple
    steps:
      - Open Settings on your device.
      - Tap your name at the top.
      - Tap Subscriptions. Open your active list.
      - Select the subscription you want to cancel.
      - Tap Cancel Subscription. Confirm to finish.
    notes: If you see an expiration message in red text, the subscription is already
      cancelled.
    source: https://support.apple.com/en-us/118428
  - channel: direct
    entry_url: https://account.apple.com
    steps:
      - Go to account.apple.com in a web browser.
      - Sign in with your Apple Account.
      - Select Subscriptions from the menu.
      - Choose the subscription you want to cancel.
      - Click Cancel Subscription. Confirm to finish.
    source: https://support.apple.com/en-us/118428
