channels:
  - channel: direct
    entry_url: https://www.netflix.com/youraccount
    steps:
      - Log into your Netflix account in a web browser.
      - Click your profile image. Go to Account.
      - Find Membership. Click Cancel.
      - Click Finish. Confirm that you want to stop.
    notes: You can continue watching until the end of your current billing period.
    source: https://help.netflix.com/node/407
  - channel: google-play
    steps: []
    notes: Subscriptions billed through Google Play are cancelled through Google
      Play; see the Google Play Subscriptions guide.
