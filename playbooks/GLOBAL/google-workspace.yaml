id: google-workspace
name: Google Workspace
aliases:
  - G Suite
  - Google Apps
category: software
website: https://workspace.google.com
merchant_patterns:
  - GOOGLE*WORKSPACE*
  - GOOGLE*GSUITE*
channels:
  - channel: direct
    entry_url: https://admin.google.com
    steps:
      - Sign in to the Google Admin console.
      - Go to Billing in the admin menu. Click Subscriptions.
      - Click on your active subscription to view details.
      - Click More and select Cancel Subscription.
      - Pick a reason for canceling and click Continue.
      - Check the box, enter your email, and click Cancel My Subscription.
    notes: Requires having billing management privileges in Google Workspace.
    source: https://knowledge.workspace.google.com/admin/billing/cancel-google-workspace
