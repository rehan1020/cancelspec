channels:
  - channel: direct
    entry_url: https://my.norton.com
    steps:
      - Sign in to your account at my.norton.com.
      - Click the My Subscriptions tab.
      - Find the plan you want to stop.
      - Click Cancel Subscription Renewal next to it.
      - Click Unsubscribe next to Plan Renewal.
      - Choose a reason for leaving and click Next.
      - Click No thanks, cancel my subscription.
      - Click Next to view the confirmation.
