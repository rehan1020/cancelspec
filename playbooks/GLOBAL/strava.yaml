channels:
  - channel: direct
    entry_url: https://www.strava.com/settings/account
    steps:
      - Log in to your Strava account at strava.com.
      - Go to Settings and select My Account.
      - Select Cancel Subscription and follow the prompts to confirm.
    notes: You will retain access to subscription features until the end of your current subscription term. Canceling does not delete your uploaded activities or data.
    source: https://support.strava.com/en-us/articles/15401936-how-do-i-cancel-my-subscription
