id: times-prime
name: Times Prime
aliases:
  - TimesPrime
category: delivery-membership
website: https://timesprime.com
merchant_patterns:
  - TIMES PRIME*
  - TIMES INTERNET*
channels:
  - channel: direct
    entry_url: https://www.timesprime.com/profile
    steps:
      - Log into Times Prime on the web or mobile browser.
      - Open Profile. View plan details.
      - Turn off auto renew.
      - Confirm to turn off recurring charges.
  - channel: bank-mandate
    steps:
      - Open your UPI app (Google Pay, PhonePe, or Paytm).
      - Open settings. Tap the Autopay list.
      - Select Times Prime from the list.
      - Tap Cancel Autopay and enter your UPI PIN.
auto_renews:
  value: true
