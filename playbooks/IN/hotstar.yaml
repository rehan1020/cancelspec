id: hotstar
name: Disney+ Hotstar
aliases:
  - Hotstar
  - Disney Hotstar
category: streaming-video
website: https://hotstar.com
merchant_patterns:
  - HOTSTAR*
  - NOVI DIGITAL*
channels:
  - channel: direct
    entry_url: https://www.hotstar.com/in/my-account
    steps:
      - Log into your Hotstar account in a web browser.
      - Click your profile. Open My Account.
      - Find your plan. Click Cancel Membership.
      - Confirm the cancellation request on the next screen.
    notes: Access continues until the current validity period expires.
  - channel: bank-mandate
    steps:
      - Open your UPI or net banking mobile app.
      - Go to settings. Tap AutoPay or mandates.
      - Find Hotstar on the list.
      - Select Revoke or Pause mandate and authenticate with your UPI PIN.
    notes: Revoking the bank mandate prevents future renewals.
tags:
