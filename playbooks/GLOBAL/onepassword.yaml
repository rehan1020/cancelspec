id: onepassword
name: 1Password
aliases:
  - 1Password Families
  - 1Password Teams
category: software
website: https://1password.com
merchant_patterns:
  - 1PASSWORD*
channels:
  - channel: direct
    entry_url: https://my.1password.com
    steps:
      - Sign in to your account on 1Password.com.
      - Select Billing in the sidebar.
      - Click Cancel subscription and follow on-screen prompts.
    notes: Your subscription remains active until the end of the current billing cycle, then the account freezes.
  - channel: apple
    steps:
      - Open Settings on your phone or tablet.
      - Tap your name at the top.
      - Tap Subscriptions. Open your active list.
      - Select 1Password. Tap to cancel.
  - channel: google-play
    steps:
      - Open your Google Play settings.
      - Find 1Password and tap Cancel.
auto_renews:
  value: true
  source: https://support.1password.com/manage-subscription/
