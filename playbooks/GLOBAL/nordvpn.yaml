id: nordvpn
name: NordVPN
category: vpn-security
website: https://nordvpn.com
merchant_patterns: []
channels:
  - channel: direct
    entry_url: https://my.nordaccount.com
    steps:
      - Log in to my.nordaccount.com in your web browser.
      - Click Billing on the left menu.
      - Find the Subscriptions section.
      - Click Cancel next to auto-renew.
      - Click Cancel. Turn off auto-renewal for your plan.
      - Check that auto-renewal now says off.
    source: https://support.nordvpn.com/hc/en-us/articles/19556844985489-How-to-cancel-auto-renewal-for-your-NordVPN-subscription
  - channel: apple
    notes: Subscriptions billed through Apple are cancelled through Apple; see the
      Apple Subscriptions guide.
    steps: []
  - channel: google-play
    notes: Subscriptions billed through Google Play are cancelled through Google
      Play; see the Google Play Subscriptions guide.
