channels:
  - channel: direct
    entry_url: https://tv.apple.com
    steps:
      - Open tv.apple.com in your web browser.
      - Click Sign In at the top of the page.
      - Click the account icon at the top.
      - Click Settings.
      - Scroll down to Subscriptions. Click Manage.
      - Click Cancel Subscription. Confirm the choice.
    source: https://support.apple.com/en-us/118398
